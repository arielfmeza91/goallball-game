name: Buscar grabaciones de balón y cascabel
on:
  push:
    branches: [main]
    paths: [scripts/research-sounds.py, .github/workflows/audio-research.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/research-sounds.py
