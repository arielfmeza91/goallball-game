name: Buscar grabaciones de balón y cascabel
on:
  push:
    branches: [main]
    paths: [scripts/research-sounds.py, .github/workflows/audio-research.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/research-sounds.py
      - name: Guardar resultados sin credenciales
        run: |
          git switch -c audio-research-results-${GITHUB_RUN_ID}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sound-research.json
          git commit -m "Record audio sources and license metadata"
          git push origin HEAD
