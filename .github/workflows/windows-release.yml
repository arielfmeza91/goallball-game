name: Goalball nativo Windows y NVDA
on:
  push:
    tags: ['v2*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Pruebas del motor
        run: dotnet run --project native/Goalball.Tests/Goalball.Tests.csproj -c Release
      - name: Crear juego nativo portátil
        shell: pwsh
        run: |
          dotnet restore native/Goalball.Windows/Goalball.Windows.csproj -r win-x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish native/Goalball.Windows/Goalball.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/GoalballSonoro-Nativo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LEEME.txt,LICENSE,SONIDOS-LICENCIA.txt dist/GoalballSonoro-Nativo/
          Copy-Item native/NAUDIO-LICENCIA.txt dist/GoalballSonoro-Nativo/
      - name: Incluir cliente oficial de NVDA y verificar
        shell: pwsh
        run: |
          try {
            ./scripts/Install-NvdaClient.ps1 -OutputDirectory dist/GoalballSonoro-Nativo
            $verification = Start-Process -FilePath (Resolve-Path dist/GoalballSonoro-Nativo/GoalballSonoro.exe) -ArgumentList '--verificar' -Wait -PassThru
            if ($verification.ExitCode -ne 0) { throw (Get-Content dist/GoalballSonoro-Nativo/verificacion.txt -Raw) }
          } catch {
            $_ | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
            throw
          }
          Get-Content dist/GoalballSonoro-Nativo/verificacion.txt
          Compress-Archive -Path dist/GoalballSonoro-Nativo -DestinationPath Goalball-Nativo-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Goalball-Nativo-Windows
          path: Goalball-Nativo-Windows.zip
      - name: Publicar descarga al crear versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" Goalball-Nativo-Windows.zip --title "Goalball nativo y NVDA $env:GITHUB_REF_NAME" --notes "Aplicación nativa WinForms para Windows. Anuncios con NVDA Controller Client oficial. Extrae todo el ZIP y abre GoalballSonoro.exe con NVDA iniciado. Consulta LEEME.txt para controles, alcance y limitaciones."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
